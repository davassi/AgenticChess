# Production stack for a single host. Everything talks over the internal
# compose network; only Caddy publishes ports.
#
# docker compose -f docker-compose.prod.yml up -d --build

name: agenticchess

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: agenticchess:latest
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No ports. Reached as postgres:5432 from the compose network only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One shot. api and worker wait for this to exit 0, so a failed migration
  # keeps them down instead of letting them run against the wrong schema.
  migrate:
    <<: *app
    command: ["node", "packages/db/dist/cli/migrate.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "apps/api/dist/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.API_PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Single replica on purpose: the worker reconciles expired deadlines on an
  # interval, so a second copy would do the same work twice.
  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.WORKER_HEALTH_PORT||3002)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # The house sparring agent's model. No published ports: only the sparring
  # service talks to it, over the compose network.
  ollama:
    image: ollama/ollama:0.33.3
    environment:
      # One request at a time and one model resident: this box has two vCPUs and
      # the API has to keep answering while a game is being played.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 1g
    # One and a half of the box's two cores: generation is allowed to be slow,
    # but never at the price of the API's tail latency.
    cpus: 1.5
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One shot, like migrate: the image ships no weights.
  #
  # Deliberately not on anyone's depends_on, and it waits for the server itself
  # rather than through a compose condition. `docker compose up -d` blocks on a
  # dependency condition and fails the whole command when it is not met, and
  # this stack's deploy script runs under `set -e`: making the deploy depend on
  # registry.ollama.ai being reachable would put an unrelated third party on
  # the critical path of every release, including the ones that only change the
  # Caddyfile. Until the weights arrive the bot plays its local fallback, which
  # is the degradation it is built for.
  ollama-pull:
    image: ollama/ollama:0.33.3
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${SPARRING_MODEL:-gemma3:270m}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  # One shot: makes the database agree with SPARRING_API_KEY. Safe on every
  # deploy - it adopts a rotated key and puts a suspended house agent back in
  # service, which is why the sparring container waits for it.
  sparring-bootstrap:
    <<: *app
    command: ["node", "packages/db/dist/cli/ensure-sparring.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  sparring:
    <<: *app
    command: ["node", "apps/sparring/dist/main.js"]
    depends_on:
      api:
        condition: service_healthy
      # Not the model pull: the bot degrades to its local fallback while the
      # weights are still arriving, and waiting would put that download on the
      # deploy's critical path.
      sparring-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.SPARRING_HEALTH_PORT||3003)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Next serves every route on demand: nothing is prerendered, so it needs the
  # database and the API at run time exactly as the other services do.
  web:
    <<: *app
    working_dir: /app/apps/web
    command: ["node", "node_modules/next/dist/bin/next", "start", "--port", "3000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Anything under 500 means Next answered. A page that renders an error
      # because the API is briefly down is not a reason to restart the server.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # The directory, not the file. Docker binds an inode, and git replaces a
    # file by writing a new one and renaming over it, so a single-file mount
    # keeps serving the version present at start-up while validate and reload
    # both report success against that stale copy.
    command: ["caddy", "run", "--config", "/etc/caddy/conf/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./deploy:/etc/caddy/conf:ro
      - ./site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
  redis-data:
  ollama-models:
  caddy-data:
  caddy-config:
