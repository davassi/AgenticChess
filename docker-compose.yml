services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aichess
      POSTGRES_PASSWORD: aichess
      POSTGRES_DB: aichess
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aichess"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Only with `docker compose --profile sparring up -d`: developing the arena
  # does not require running a model.
  ollama:
    image: ollama/ollama:latest
    profiles: ["sparring"]
    ports:
      - "11435:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  ollama-models:
